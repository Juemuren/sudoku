name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
          cache: true
      - run: deno install --frozen-lockfile
      - run: deno task check
      - run: deno task test
      - run: deno task tui:build
      - run: deno task webui:build
